<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#172020;color:#dce7e1;font:16px/1.8 system-ui}main{max-width:1200px;margin:auto;padding:32px 24px}h1{font-size:30px}h2{font-size:23px}a{color:#b9d4c8}table{border-collapse:collapse;width:100%}td,th{border:1px solid #45544f;padding:12px;text-align:left;vertical-align:top}nav{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}button{padding:12px 18px;background:#273632;color:inherit;border:1px solid #6b8178;border-radius:6px;cursor:pointer}button[aria-selected=true]{background:#bbd0c5;color:#14241d}.card{padding:18px;border:1px solid #45544f;margin:14px 0;border-radius:8px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}.note,small{color:#aec0b7}.numbers{display:flex;gap:20px;flex-wrap:wrap}.numbers div{padding:15px;background:#24332c}.numbers strong,.numbers small{display:block}details{margin:24px 0}img{max-width:100%}@media(max-width:700px){.compare{grid-template-columns:1fr}td,th{padding:7px;font-size:14px}}</style><title>版本調整</title><main><p><a href="方案比較.html">六版對照</a> · <a id="openModel" href="index.html">開啟本版3D</a> · <a id="openAI" href="AI寫實視角.html">AI圖集</a></p><h1>現行版本與調整</h1><p>VN01｜2026-09-24｜現行編號：原V4→V2、原V2→V4、原V3→V5；新增V3。V0與V1保持。歷史圖檔與紀錄使用當時編號，請依本表對照。</p><nav role="tablist"><button role="tab" id="tab-v0" data-version="v0">V0</button><button role="tab" id="tab-v1" data-version="v1">V1</button><button role="tab" id="tab-v2" data-version="v2">V2</button><button role="tab" id="tab-v3" data-version="v3">V3</button><button role="tab" id="tab-v4" data-version="v4">V4</button><button role="tab" id="tab-v5" data-version="v5">V5</button></nav><section id="versionPanel" role="tabpanel"><h2 id="versionTitle"></h2><p class="note">尺寸皆為模型值，實品、現場與工程仍待核定。</p><div class="numbers" id="metrics"></div><div id="specific"></div><details><summary id="legacyLabel"></summary><div id="legacy"></div></details></section></main><script src="version-registry.js?v=20260924-vn01"></script><script src="version-changes.js?v=20260924-vn01"></script><script>(()=>{const D=HOME_VERSION_CHANGES,R=HOME_VERSION_REGISTRY.versions,$=id=>document.getElementById(id);function cards(rows){return rows.map(r=>{const a=document.createElement('article');a.className='card';const h=document.createElement('h3');h.textContent=r[0];a.append(h);const c=document.createElement('div');c.className='compare';for(const [i,label] of [[1,'原方案'],[2,'目前']]){const p=document.createElement('p');p.textContent=label+'：'+r[i];c.append(p);}a.append(c);const n=document.createElement('p');n.className='note';n.textContent=r[3];a.append(n);return a;});}
function render(v){const entry=R.find(x=>x.id===v)||R[1];v=entry.id;const d=D.variants[v];$('versionTitle').textContent=d.title;document.title=d.title+'｜調整內容';$('versionPanel').setAttribute('aria-labelledby','tab-'+v);document.querySelectorAll('[data-version]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.version===v));b.tabIndex=b.dataset.version===v?0:-1;});$('specific').replaceChildren(...cards(d.currentRows));$('openModel').href=entry.path+'?layout='+v;$('openAI').href='AI寫實視角.html?version='+v;const metrics={v0:[['80 cm','原圖檯寬']],v1:[['260 × 160.2 cm','圓弧中島外廓']],v2:[['280 × 110 cm','長中島外廓'],['347.2 cm','模型耳位至螢幕']],v3:[['260 × 160.2 cm','圓弧中島外廓'],['260 × 30 cm','雙面玻璃櫃外廓'],['95 cm','檯面完成高']],v4:[['189 × 81 cm','小中島外廓']],v5:[['300 × 95 cm','大中島外廓']]};$('metrics').innerHTML=metrics[v].map(([n,label])=>'<div><strong>'+n+'</strong><small>'+label+'</small></div>').join('');$('legacy').replaceChildren(...cards(d.rows));$('legacyLabel').textContent='查看沿革（當時編號 '+d.legacyNumber+'，不能視為現行配置）';history.replaceState(null,'','?version='+v);}
document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>render(b.dataset.version));render(new URLSearchParams(location.search).get('version')||'v1');})();</script></html>
