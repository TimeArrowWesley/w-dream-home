<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W 夢想之家｜全屋 AI 寫實視角</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121b1b;color:#edf1e9;font-family:"Microsoft JhengHei",sans-serif}header,main,footer{max-width:1500px;margin:auto;padding:24px 5vw}h1{font-size:28px;font-weight:500;letter-spacing:.06em}p{color:#b8c8bf;line-height:1.8}a{color:#c8ded0;text-underline-offset:4px}nav,.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:center}.filters{margin-top:24px}select{font:inherit;font-size:14px;background:#263630;color:#f0f4ea;padding:10px 12px;border:1px solid #657b70;border-radius:6px;max-width:100%}label{display:flex;gap:10px;align-items:center;font-size:14px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}article{background:#1e2b26;border:1px solid #43574b;border-radius:9px;overflow:hidden}article>a{display:block}img{width:100%;aspect-ratio:16/9;object-fit:contain;display:block;background:#111a17}article>div{padding:16px}h2{font-size:17px;margin:0 0 12px;font-weight:500}article nav{font-size:13px;gap:14px}#count{font-size:13px}a:focus-visible,select:focus-visible{outline:3px solid #b8d4c3;outline-offset:3px}footer{font-size:13px}@media(max-width:600px){header,main,footer{padding:18px}main{grid-template-columns:1fr}h1{font-size:23px}.filters{gap:10px}label{width:100%;justify-content:space-between}select{width:75%}}
</style></head><body>
<header><h1>W 夢想之家 · 全屋 AI 寫實視角</h1><p>依最新模型逐區製作。先選版本與區域，點圖片可開啟原圖。</p>
<nav><a href="index.html">開啟主專案</a><a href="方案比較.html">比較 V1～V4</a></nav>
<div class="filters"><label>版本<select id="version" aria-label="設計版本"><option value="v1">V1 圓弧中島＋高矮櫃</option><option value="v2">V2 圓弧中島＋矮櫃</option><option value="v3">V3 旋轉電視＋高矮櫃</option><option value="v4">V4 旋轉電視＋矮櫃</option></select></label><label>區域<select id="room" aria-label="區域"></select></label><span id="count" role="status"></span></div></header>
<main id="photos"></main><footer><p>AI 設計效果圖；精確尺寸與互動以 3D 模型為準。相同區域且取景內配置一致時共用圖片，四版玄關各自呈現。<a href="assets/ai-interiors/README.md">圖片與生成紀錄</a></p></footer>
<script src="assets/ai-interiors/catalog.js"></script><script>
const version=document.getElementById('version'),room=document.getElementById('room'),photos=document.getElementById('photos');
const rooms={all:'全屋',entry:'玄關',living:'客廳',island:'中島',kitchen:'廚房',bed:'主臥',closet:'更衣室',study:'雙人書房',collection:'收藏室',bath1:'主浴',bath2:'客浴',storage:'儲藏室',back:'後陽台'};
Object.entries(rooms).forEach(([id,label])=>room.add(new Option(label,id)));
const params=new URLSearchParams(location.search);if(HOME_AI_PHOTOS[params.get('version')])version.value=params.get('version');if(rooms[params.get('room')])room.value=params.get('room');
function show(){
 photos.replaceChildren();const items=HOME_AI_PHOTOS[version.value].filter(p=>room.value==='all'||p.room===room.value);
 document.getElementById('count').textContent=items.length+' 張';
 for(const item of items){
  const card=document.createElement('article'),link=document.createElement('a'),img=document.createElement('img');
  link.href=item.src;link.target='_blank';img.src=item.src;img.alt=version.value.toUpperCase()+' '+item.label+' AI 設計效果圖';img.loading='lazy';link.append(img);card.append(link);
  const body=document.createElement('div'),title=document.createElement('h2');title.textContent=version.value.toUpperCase()+' · '+item.label;body.append(title);
  const nav=document.createElement('nav'),open=document.createElement('a'),download=document.createElement('a'),rotating=['v3','v4'].includes(version.value);
  open.href=(rotating?'提案/旋轉電視與直線中島/index.html':'index.html')+'?layout='+(['v2','v4'].includes(version.value)?'v2':'v1')+'#ai='+item.room;open.textContent='在專案查看此區';
  download.href=item.src;download.download=version.value+'-'+item.id+'.png';download.textContent='下載圖片';nav.append(open,download);body.append(nav);card.append(body);photos.append(card);
 }
}
version.onchange=room.onchange=show;show();
</script></body></html>
