<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="732" viewBox="0 0 1080 732" font-family="Microsoft JhengHei, sans-serif"><rect width="100%" height="100%" fill="#edf0e9"/><text x="28" y="42" font-size="25" fill="#293c34" text-anchor="start">曲線中島：開口朝冰箱＋設備分艙</text><text x="28" y="74" font-size="14" fill="#293c34" text-anchor="start">色塊源自機身外徑；檯面高95、厚3，酒櫃落地高85。通風／接管仍待供貨商核准。</text><text x="28" y="97" font-size="14" fill="#146477" text-anchor="start">← 主冰箱側（西）；藍箭頭為設備進出／檢修方向</text><g transform="translate(50 105)"><g transform="scale(1.6) translate(-404.8 -498.1)"><polygon points="404.8,588.1 524.9,588.1 530.63,587.87 536.24,587.18 541.7,586.07 547,584.54 552.12,582.6 557.04,580.29 561.75,577.62 566.22,574.61 570.43,571.26 574.38,567.61 578.03,563.67 581.38,559.46 584.4,554.99 587.08,550.29 589.39,545.36 591.33,540.24 592.86,534.93 593.98,529.46 594.67,523.85 594.9,518.1 594.9,498.1 664.8,498.1 664.8,518.1 664.34,529.58 662.97,540.8 660.73,551.73 657.66,562.33 653.8,572.57 649.17,582.41 643.82,591.81 637.78,600.74 631.09,609.16 623.79,617.04 615.9,624.34 607.47,631.02 598.54,637.05 589.13,642.39 579.29,647.01 569.04,650.87 558.44,653.94 547.5,656.17 536.28,657.54 524.8,658 404.8,658.3" fill="#d1c8aa" stroke="#8b8268"/><rect x="406.600" y="590.200" width="66.300" height="65.700" fill="#ad755b" stroke="white" stroke-width="1" fill-opacity=".86"/><path d="M410.59999999999997 623.05H388.59999999999997m6 -4l-6 4 6 4" fill="none" stroke="#146477" stroke-width="2"/><rect x="598.750" y="500.950" width="47.500" height="38.100" fill="#7a8fb0" stroke="white" stroke-width="1" fill-opacity=".86"/><path d="M602.75 520.0H580.75m6 -4l-6 4 6 4" fill="none" stroke="#146477" stroke-width="2"/><rect x="595.000" y="555.250" width="38.000" height="11.500" fill="#569eaa" stroke="white" stroke-width="1" fill-opacity=".86"/><path d="M598.9999999992549 561.0H576.9999999992549m6 -4l-6 4 6 4" fill="none" stroke="#146477" stroke-width="2"/><rect x="479.000" y="597.900" width="30.600" height="52.700" fill="#454b51" stroke="white" stroke-width="1" fill-opacity=".86"/><circle cx="625" cy="561" r="11" fill="#dbe5df" stroke="#63827c"/></g></g><rect x="540" y="105" width="16" height="16" fill="#ad755b"/><text x="565" y="120" font-size="16" fill="#293c34" text-anchor="start">酒櫃  Liebherr WKb1712</text><text x="565" y="143" font-size="14" fill="#637366" text-anchor="start">寬65.7 × 深66.3 × 高85 cm</text><rect x="540" y="169" width="16" height="16" fill="#7a8fb0"/><text x="565" y="184" font-size="16" fill="#293c34" text-anchor="start">掃地基座  Roborock Saros 20 上下水基座</text><text x="565" y="207" font-size="14" fill="#637366" text-anchor="start">寬38.1 × 深47.5 × 高30 cm</text><rect x="540" y="233" width="16" height="16" fill="#569eaa"/><text x="565" y="248" font-size="16" fill="#293c34" text-anchor="start">飲水機  CLAR WS2-C1 瞬冰瞬熱主機</text><text x="565" y="271" font-size="14" fill="#637366" text-anchor="start">寬11.5 × 深38 × 高32.5 cm</text><rect x="540" y="297" width="16" height="16" fill="#454b51"/><text x="565" y="312" font-size="16" fill="#293c34" text-anchor="start">IH  Bosch PIB375FB1E</text><text x="565" y="335" font-size="14" fill="#637366" text-anchor="start">寬30.6 × 深52.7 × 高5.1 cm</text><text x="30" y="437" font-size="19" fill="#293c34" text-anchor="start">酒櫃高度剖面</text><path d="M60 650H490" stroke="#53665a" stroke-width="2"/><rect x="80" y="460" width="260" height="6" fill="#9b9c86"/><rect x="100" y="480" width="190" height="170" fill="#ad755b"/><text x="305" y="580" font-size="17" fill="#293c34" text-anchor="start">85</text><text x="355" y="470" font-size="15" fill="#293c34" text-anchor="start">檯面頂95</text><text x="355" y="497" font-size="15" fill="#293c34" text-anchor="start">底92／頂部餘7</text><text x="120" y="564" font-size="20" fill="white" text-anchor="start">WKb1712</text><text x="112" y="590" font-size="15" fill="white" text-anchor="start">機器直接落地</text><text x="550" y="465" font-size="19" fill="#293c34" text-anchor="start">本次分艙的取捨</text><text x="550" y="500" font-size="14" fill="#293c34" text-anchor="start">曲線輪廓、內側90與南側94.7名義淨距保留。</text><text x="550" y="530" font-size="14" fill="#293c34" text-anchor="start">酒櫃向西；掃地機移北端檯面下，向西進出。</text><text x="550" y="560" font-size="14" fill="#293c34" text-anchor="start">飲水機與小水槽移內側曲線段，檢修門向西。</text><text x="550" y="590" font-size="14" fill="#293c34" text-anchor="start">IH獨立通風層，與酒櫃、掃地機及濕區分艙。</text><text x="550" y="615" font-size="14" fill="#293c34" text-anchor="start">黃色預留可於 3D「檢視櫃內／維修預留」開啟。</text><text x="30" y="698" font-size="14" fill="#293c34" text-anchor="start">7cm頂部空間僅為模型值；獨立式酒櫃能否這樣配置，仍須台灣供貨商提供安裝圖。</text></svg>