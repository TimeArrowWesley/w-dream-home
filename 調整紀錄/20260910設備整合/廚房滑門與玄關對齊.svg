transform="translate(623 170) scale(1.26) translate(-60 -470)"><rect x="60" y="470" width="397" height="362" fill="#edf0e8" stroke="none" /><rect x="60" y="490" width="157" height="337" fill="#deded5" stroke="none" /><rect x="210" y="593" width="10" height="32" fill="#7c837e" stroke="none" /><rect x="210" y="745" width="10" height="82" fill="#7c837e" stroke="none" /><rect x="81.85" y="492" width="120" height="63" fill="#99a29a" stroke="none" /><rect x="225" y="493" width="90" height="132" fill="#c0c9bb" stroke="none" /><rect x="215" y="753" width="242" height="40" fill="#b0c8c3" stroke="#667e78" /><rect x="203.5" y="501" width="3" height="124" fill="none" stroke="#629487" stroke-width="1" stroke-dasharray="3 3"/><rect x="203.5" y="501" width="3" height="124" fill="#158174" stroke="#12574f" stroke-width="1"/><text x="91" y="525" fill="#273e38" font-size="14">C 區高櫃</text><text x="239" y="547" fill="#273e38" font-size="14">主冰箱</text><text x="84" y="697" fill="#273e38" font-size="19">廚房</text><text x="285" y="675" fill="#273e38" font-size="18">中島方向 →</text><text x="258" y="777" fill="#273e38" font-size="14">收藏展示櫃</text><path d="M230 628V742m-4 -114h8m-8 114h8" stroke="#bc6f43" fill="none"/><text x="239" y="714" fill="#a05730" font-size="14">門洞 120 cm</text><path d="M190 697V574m-6 8l6 -8 6 8" stroke="#158174" stroke-width="2" fill="none"/></g><text x="623" y="633" fill="#273e38" font-size="16">北移 122 cm，門片南端停在門洞北緣</text><text x="38" y="697" fill="#273e38" font-size="24">玄關與展示櫃｜統一朝客廳的完成面</text><text x="38" y="728" fill="#273e38" font-size="16">玻璃櫃保留 40 cm 外深；玄關恢復 50 cm 外深，向收藏室內移的舊方案不再套用。</text><g transform="translate(70 754) scale(1.85 1.85) translate(-450 -738)"><rect x="460" y="753" width="90" height="40" fill="#adc9c2" stroke="#536e65" /><rect x="550" y="753" width="60" height="50" fill="#8c9a8f" stroke="#536e65" /><rect x="610" y="753" width="65" height="50" fill="#b6c1b1" stroke="#536e65" /><rect x="675" y="753" width="35" height="50" fill="#cbd2bd" stroke="#536e65" /><path d="M455 753H715" stroke="#188578" stroke-width="1.5"/><text x="477" y="777" fill="#273e38" font-size="9">玻璃櫃</text><text x="558" y="777" fill="#273e38" font-size="9">高／矮櫃</text><text x="623" y="777" fill="#273e38" font-size="9">雜物櫃</text><text x="680" y="777" fill="#273e38" font-size="8">少量鞋</text><text x="455" y="746" fill="#273e38" font-size="9">↑ 客廳；綠線為齊平完成面</text><text x="553" y="815" fill="#273e38" font-size="9">↓ 玄關側門片仍維持原位</text></g><text x="640" y="800" fill="#273e38" font-size="18">V1／V3：高矮櫃</text><text x="640" y="834" fill="#273e38" font-size="18">V2／V4：90 cm 矮櫃</text><text x="640" y="873" fill="#273e38" font-size="15">掛外套、側面帽鉤、鑰匙與包包區保留</text><text x="38" y="945" fill="#273e38" font-size="15">門片與 C 櫃側面最近約 1.65 cm；門機、安裝公差與牆面開關尺寸須由門廠複核。</text><text x="38" y="976" fill="#66786d" font-size="14">這張圖是平面檢視圖；玻璃透明度、材質與實際瀏覽器畫面仍需開啟 3D 檢視。</text></svg>