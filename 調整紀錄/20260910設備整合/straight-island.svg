<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="732" viewBox="0 0 1080 732" font-family="Microsoft JhengHei, sans-serif"><rect width="100%" height="100%" fill="#edf0e9"/><text x="28" y="42" font-size="25" fill="#293c34" text-anchor="start">直線中島：開口朝冰箱＋設備分艙</text><text x="28" y="74" font-size="14" fill="#293c34" text-anchor="start">色塊源自機身外徑；檯面高95、厚3，酒櫃落地高85。通風／接管仍待供貨商核准。</text><text x="28" y="97" font-size="14" fill="#146477" text-anchor="start">← 主冰箱側（西）；藍箭頭為設備進出／檢修方向</text><g transform="translate(50 105)"><g transform="scale(1.6) translate(-434 -464)"><rect x="434.000" y="464.000" width="81.000" height="189.000" fill="#d1c8aa" stroke="#607367" stroke-width="1" /><rect x="435.850" y="469.150" width="66.300" height="65.700" fill="#ad755b" stroke="white" stroke-width="1" fill-opacity=".86"/><path d="M439.85 502.0H417.85m6 -4l-6 4 6 4" fill="none" stroke="#146477" stroke-width="2"/><rect x="435.000" y="543.950" width="47.500" height="38.100" fill="#7a8fb0" stroke="white" stroke-width="1" fill-opacity=".86"/><path d="M439 563.0H417m6 -4l-6 4 6 4" fill="none" stroke="#146477" stroke-width="2"/><rect x="437.000" y="597.000" width="38.000" height="11.500" fill="#569eaa" stroke="white" stroke-width="1" fill-opacity=".86"/><path d="M440.99999999925495 602.75H418.99999999925495m6 -4l-6 4 6 4" fill="none" stroke="#146477" stroke-width="2"/><rect x="446.650" y="546.000" width="52.700" height="30.600" fill="#454b51" stroke="white" stroke-width="1" fill-opacity=".86"/><circle cx="460" cy="629" r="11" fill="#dbe5df" stroke="#63827c"/><rect x="487.000" y="596.000" width="28.000" height="53.000" fill="none" stroke="#477864" stroke-width="1" stroke-dasharray="3 2"/></g></g><rect x="540" y="105" width="16" height="16" fill="#ad755b"/><text x="565" y="120" font-size="16" fill="#293c34" text-anchor="start">酒櫃  Liebherr WKb1712</text><text x="565" y="143" font-size="14" fill="#637366" text-anchor="start">寬65.7 × 深66.3 × 高85 cm</text><rect x="540" y="169" width="16" height="16" fill="#7a8fb0"/><text x="565" y="184" font-size="16" fill="#293c34" text-anchor="start">掃地基座  Roborock Saros 20 上下水基座</text><text x="565" y="207" font-size="14" fill="#637366" text-anchor="start">寬38.1 × 深47.5 × 高30 cm</text><rect x="540" y="233" width="16" height="16" fill="#569eaa"/><text x="565" y="248" font-size="16" fill="#293c34" text-anchor="start">飲水機  CLAR WS2-C1 瞬冰瞬熱主機</text><text x="565" y="271" font-size="14" fill="#637366" text-anchor="start">寬11.5 × 深38 × 高32.5 cm</text><rect x="540" y="297" width="16" height="16" fill="#454b51"/><text x="565" y="312" font-size="16" fill="#293c34" text-anchor="start">IH  Bosch PIB375FB1E</text><text x="565" y="335" font-size="14" fill="#637366" text-anchor="start">寬30.6 × 深52.7 × 高5.1 cm</text><text x="30" y="437" font-size="19" fill="#293c34" text-anchor="start">酒櫃高度剖面</text><path d="M60 650H490" stroke="#53665a" stroke-width="2"/><rect x="80" y="460" width="260" height="6" fill="#9b9c86"/><rect x="100" y="480" width="190" height="170" fill="#ad755b"/><text x="305" y="580" font-size="17" fill="#293c34" text-anchor="start">85</text><text x="355" y="470" font-size="15" fill="#293c34" text-anchor="start">檯面頂95</text><text x="355" y="497" font-size="15" fill="#293c34" text-anchor="start">底92／頂部餘7</text><text x="120" y="564" font-size="20" fill="white" text-anchor="start">WKb1712</text><text x="112" y="590" font-size="15" fill="white" text-anchor="start">機器直接落地</text><text x="550" y="465" font-size="19" fill="#293c34" text-anchor="start">本次分艙的取捨</text><text x="550" y="500" font-size="14" fill="#293c34" text-anchor="start">酒櫃、掃地機與飲水檢修都朝西／冰箱。</text><text x="550" y="530" font-size="14" fill="#293c34" text-anchor="start">掃地機在中段檯面下，上方與IH隔開。</text><text x="550" y="560" font-size="14" fill="#293c34" text-anchor="start">南端留膝改東側，仍28深×53寬。</text><text x="550" y="590" font-size="14" fill="#293c34" text-anchor="start">水槽隨濕區往西；酒櫃與冰箱勿同時開門。</text><text x="550" y="615" font-size="14" fill="#293c34" text-anchor="start">黃色預留可於 3D「檢視櫃內／維修預留」開啟。</text><text x="30" y="698" font-size="14" fill="#293c34" text-anchor="start">7cm頂部空間僅為模型值；獨立式酒櫃能否這樣配置，仍須台灣供貨商提供安裝圖。</text></svg>