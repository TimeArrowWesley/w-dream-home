</style></head><body><header><div><h1>V1 全屋 Blender</h1><p>BW03 · 十二空間 · 霧黑天花、灰石與灰褐木材</p></div><a href="index.html">進入可操作 3D ↗</a></header><main><nav aria-label="房間"></nav><figure><img id="preview" alt=""><figcaption><div><strong id="roomName"></strong><div id="kind"></div></div><div class="modes"><button id="renderMode" aria-pressed="true">Blender 渲染</button><button id="aiMode" aria-pressed="false">AI 風格參考</button></div></figcaption></figure><footer>Blender 圖是同一套可編輯 3D 的實際 Cycles 渲染。AI 圖保留作風格對照；網頁另採材質、分區光照與即時鏡面。格局與家具占地沿用 V1，材質產品、尺寸及施工仍待核定。 更衣室已同步CW01窗位／門向；AI保留作風格參考。<a href="模型複核.html">查看複核</a> <a href="工業細節修整.html">SF01曲面／織品修整</a></footer></main><script>const entries=[{"room":"living","name":"客廳","angle":"A","render":"assets/blender-v1/bw03/living-E-sf01.webp","ai":"成品圖集/20260914暗色現代工業/images/v1-living-A-ir01.webp","renderAngle":"E","renderRevision":"SF01"},{"room":"island","name":"圓弧中島","angle":"A","render":"assets/blender-v1/bw03/island-A-sf01.webp","ai":"成品圖集/20260914暗色現代工業/images/v1-island-A-bi01.webp","renderAngle":"A","renderRevision":"SF01"},{"room":"entry","name":"玄關","angle":"C","render":"assets/blender-v1/bw03/entry-C-sf01.webp","ai":"成品圖集/20260914暗色現代工業/images/v1-entry-door5C-au01.webp","renderAngle":"C","renderRevision":"SF01"},{"room":"kitchen","name":"廚房","angle":"A","render":"assets/blender-v1/bw03/kitchen-cycles.webp","ai":"成品圖集/20260914暗色現代工業/images/kitchen-A-kp02.webp"},{"room":"bed","name":"主臥","angle":"A","render":"assets/blender-v1/bw03/bed-A-sf01.webp","ai":"成品圖集/20260914暗色現代工業/images/v0-bed-A-vt02.webp","renderAngle":"A","renderRevision":"SF01"},{"room":"closet","name":"更衣室","angle":"A","render":"assets/blender-v1/bw03/closet-A-sf01.webp","ai":"成品圖集/20260914暗色現代工業/images/closet-A-cl01.webp","renderAngle":"A","renderRevision":"SF01"},{"room":"study","name":"雙人電競房","angle":"A","render":"assets/blender-v1/bw03/study-cycles.webp","ai":"成品圖集/20260914暗色現代工業/images/study-A-cp02.webp"},{"room":"collection","name":"收藏室","angle":"A","render":"assets/blender-v1/bw03/collection-cycles.webp","ai":"成品圖集/20260914暗色現代工業/images/v1-collection-A-bi01.webp"},{"room":"bath1","name":"主浴","angle":"A","render":"assets/blender-v1/bw03/bath1-cycles.webp","ai":"成品圖集/20260914暗色現代工業/images/v1-bath1-A-bi01.webp"},{"room":"bath2","name":"客浴","angle":"A","render":"assets/blender-v1/bw03/bath2-cycles.webp","ai":"成品圖集/20260914暗色現代工業/images/v1-bath2-A-bi01.webp"},{"room":"storage","name":"儲藏室","angle":"B","render":"assets/blender-v1/bw03/storage-cycles.webp","ai":"成品圖集/20260914暗色現代工業/images/v1-storage-B-bi01.webp"},{"room":"back","name":"後陽台","angle":"A","render":"assets/blender-v1/bw03/back-A-sf01.webp","ai":"成品圖集/20260914暗色現代工業/images/v0-back-A-bi01.webp","renderAngle":"A","renderRevision":"SF01"}];let room=entries[0],mode='render';const $=id=>document.getElementById(id);function show(){ $('preview').src=room[mode];$('preview').alt=room.name+' · '+(mode==='render'?'Blender Cycles 渲染':'AI 風格參考');$('roomName').textContent=room.name+' · 方向 '+(mode==='render'?(room.renderAngle||room.angle):room.angle);$('kind').textContent=mode==='render'?(room.renderRevision||'BW03')+'／實際模型渲染':'既有 AI 概念效果圖';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.room===room.room));$('renderMode').setAttribute('aria-pressed',mode==='render');$('aiMode').setAttribute('aria-pressed',mode==='ai');}for(const e of entries){const b=document.createElement('button');b.textContent=e.name;b.dataset.room=e.room;b.onclick=()=>{room=e;show()};document.querySelector('nav').append(b)}$('renderMode').onclick=()=>{mode='render';show()};$('aiMode').onclick=()=>{mode='ai';show()};show();</script></body></html>
